name: DevSecOps Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "20"

  # Docker
  IMAGE_NAME: dev-radar-backend

  # AWS / ECR Public
  AWS_REGION: us-east-1
  ECR_REGISTRY: public.ecr.aws/u1g0y0f1
  ECR_REPOSITORY: 3-tier

  # Nexus
  NEXUS_REPOSITORY: trivy-reports

jobs:

  # ============================================================
  # JOB 1
  # VERIFY + TEST + SONARQUBE + TRIVY + NEXUS
  # ============================================================

  verify-analyze-scan:

    name: Verify, Analyze, Scan and Upload Report

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout source code
        uses: actions/checkout@v4


      # ==========================================================
      # 2. SETUP NODE.JS
      # ==========================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm


      # ==========================================================
      # 3. INSTALL YARN
      # ==========================================================

      - name: Setup Yarn
        run: |
          npm install -g yarn
          yarn --version


      # ==========================================================
      # 4. INSTALL DEPENDENCIES
      # ==========================================================

      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile


      # ==========================================================
      # 5. RUN APPLICATION TESTS
      # ==========================================================

      - name: Run tests
        run: |
          npm test -- --runInBand


      # ==========================================================
      # 6. SONARQUBE ANALYSIS
      # ==========================================================

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=devsecops-2
            -Dsonar.projectName=devsecops-2
            -Dsonar.sources=.
            -Dsonar.exclusions=node_modules/**,coverage/**,reports/**
            -Dsonar.qualitygate.wait=true


      # ==========================================================
      # 7. SONARQUBE QUALITY GATE
      # ==========================================================

      - name: SonarQube Quality Gate
        run: |
          echo "SonarQube analysis and Quality Gate completed successfully."


      # ==========================================================
      # 8. BUILD DOCKER IMAGE
      # ==========================================================

      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE_NAME:${GITHUB_SHA} \
            -t $IMAGE_NAME:latest \
            .


      # ==========================================================
      # 9. INSTALL TRIVY
      # ==========================================================

      - name: Install Trivy
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            wget \
            apt-transport-https \
            gnupg \
            lsb-release

          wget -qO - \
            https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
            https://aquasecurity.github.io/trivy-repo/deb \
            $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update

          sudo apt-get install -y trivy

          trivy --version


      # ==========================================================
      # 10. TRIVY FILESYSTEM / DEPENDENCY SCAN
      # ==========================================================

      - name: Trivy filesystem scan
        run: |

          mkdir -p reports

          trivy fs \
            --format json \
            --output reports/trivy-fs.json \
            --scanners vuln,secret,misconfig \
            .


      # ==========================================================
      # 11. TRIVY DOCKER IMAGE SCAN
      # ==========================================================

      - name: Trivy Docker image scan
        run: |

          trivy image \
            --format json \
            --output reports/trivy-image.json \
            --severity HIGH,CRITICAL \
            $IMAGE_NAME:${GITHUB_SHA}


      # ==========================================================
      # 12. DISPLAY TRIVY SECURITY SUMMARY
      # ==========================================================

      - name: Display Trivy security summary
        run: |

          echo "=========================================="
          echo "TRIVY HIGH / CRITICAL VULNERABILITIES"
          echo "=========================================="

          trivy image \
            --severity HIGH,CRITICAL \
            $IMAGE_NAME:${GITHUB_SHA}


      # ==========================================================
      # 13. COMBINE SECURITY REPORTS
      # ==========================================================

      - name: Prepare security reports
        run: |

          echo "Security reports generated:"
          ls -lh reports/

          echo "Trivy filesystem report:"
          test -f reports/trivy-fs.json

          echo "Trivy image report:"
          test -f reports/trivy-image.json


      # ==========================================================
      # 14. UPLOAD TRIVY REPORT ARTIFACT
      # ==========================================================

      - name: Upload Trivy reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-reports-${{ github.sha }}
          path: reports/


      # ==========================================================
      # 15. ENCRYPT TRIVY REPORT
      # ==========================================================

      - name: Encrypt Trivy reports
        env:
          TRIVY_REPORT_ENCRYPTION_KEY: ${{ secrets.TRIVY_REPORT_ENCRYPTION_KEY }}
          REPORT_ENCRYPTION_KEY: ${{ secrets.REPORT_ENCRYPTION_KEY }}

        run: |

          set -e

          echo "Checking encryption keys..."

          test -n "$TRIVY_REPORT_ENCRYPTION_KEY"
          test -n "$REPORT_ENCRYPTION_KEY"

          echo "Encrypting Trivy image report..."

          openssl enc \