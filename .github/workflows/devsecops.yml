name: DevSecOps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  IMAGE_NAME: dev-radar-backend

jobs:
  verify-and-scan:
    name: Verify, analyze, and scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run npm audit
        run: |
          mkdir -p reports
          npm install --package-lock-only --ignore-scripts --no-audit
          npm audit --audit-level=high --json > reports/npm-audit.json

      - name: Run tests and collect coverage
        run: yarn test

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v7.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube quality gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Build container image
        run: docker build --tag "$IMAGE_NAME:${GITHUB_SHA}" .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: json
          output: reports/trivy-image.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Encrypt Trivy report with AES-256
        if: always() && github.event_name == 'push'
        env:
          REPORT_ENCRYPTION_KEY: ${{ secrets.REPORT_ENCRYPTION_KEY }}
        run: |
          test -n "$REPORT_ENCRYPTION_KEY"
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in reports/trivy-image.json \
            -out reports/trivy-image.json.enc \
            -pass env:REPORT_ENCRYPTION_KEY

      - name: Upload plaintext scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.sha }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload encrypted Trivy report
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-trivy-report-${{ github.sha }}
          path: reports/trivy-image.json.enc
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish approved image and encrypted report
    needs: verify-and-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download encrypted Trivy report
        uses: actions/download-artifact@v4
        with:
          name: encrypted-trivy-report-${{ github.sha }}
          path: reports

      - name: Upload encrypted report to Nexus
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          NEXUS_REPOSITORY: ${{ vars.NEXUS_REPOSITORY }}
        run: |
          test -n "$NEXUS_URL" && test -n "$NEXUS_USERNAME" && test -n "$NEXUS_PASSWORD" && test -n "$NEXUS_REPOSITORY"
          curl --fail --silent --show-error \
            --user "$NEXUS_USERNAME:$NEXUS_PASSWORD" \
            --upload-file reports/trivy-image.json.enc \
            "${NEXUS_URL%/}/repository/${NEXUS_REPOSITORY}/dev-radar-backend/${GITHUB_SHA}/trivy-image.json.enc"

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Checkout source for image publication
        uses: actions/checkout@v7

      - name: Build and push SHA-tagged image to ECR
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          test -n "$ECR_REPOSITORY"
          docker build --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
